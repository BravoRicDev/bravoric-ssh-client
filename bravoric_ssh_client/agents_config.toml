# Agenti AI candidati per LaunchAgentScreen.
#
# Campi:
#   name       - nome del binario (usato anche come comando)
#   model_cmd  - comando eseguito via SSH per ottenere la lista modelli (uno per riga).
#                Vuoto = nessun Select modello (l'agente sceglie da solo).
#   model_arg  - flag da passare all'agente per specificare il modello (es. "--model")
#
# L'ordine determina la posizione nel Select. Gli agenti non trovati sul host vengono omessi.
# Per aggiungere un agente: copia un blocco [[candidates]] e adatta i campi.

[[candidates]]
name = "opencode"
model_cmd = "opencode models"
model_arg = "--model"

[[candidates]]
name = "claude"
# claude models richiede OAuth attiva sul host; se scade non funziona.
# Lasciato vuoto: nessun select modello, Claude sceglie da solo.
model_cmd = ""
model_arg = "--model"

[[candidates]]
name = "hermes"
# hermes model richiede TTY interattivo; leggiamo da ~/.hermes/provider_models_cache.json
model_cmd = "python3 -c \"import json,os; f=os.path.expanduser('~/.hermes/provider_models_cache.json'); d=json.load(open(f)) if os.path.exists(f) else {}; [print(p+'/'+(m.get('id','') if isinstance(m,dict) else str(m))) for p,v in d.items() for m in v.get('models',[]) if (m.get('id','') if isinstance(m,dict) else m)]\""
model_arg = "-m"

[[candidates]]
name = "pi"
# pi --list-models: header + righe "provider  model  ..."
model_cmd = "pi --list-models 2>&1 | grep -v '^\\[' | awk 'NR>1 && NF>=2 {print $1\"/\"$2}'"
model_arg = "--model"

[[candidates]]
name = "agy"
# agy models: "model-id\tModel Name" oppure solo "model-id"
model_cmd = "agy models 2>&1 | grep -v 'Fetching' | awk 'NF>=1 {print $1}'"
model_arg = "--model"

