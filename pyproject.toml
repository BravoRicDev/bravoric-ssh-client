[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bravoric-ssh-client"
version = "0.1.0"
description = "A full-screen SSH + tmux TUI client (Textual), with an MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Riccardo (bravoric)" }]
keywords = ["ssh", "tmux", "tui", "textual", "client", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "textual>=2.0",
    "keyring>=24.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/BravoRicDev/bravoric-ssh-client"
Repository = "https://github.com/BravoRicDev/bravoric-ssh-client"
Issues = "https://github.com/BravoRicDev/bravoric-ssh-client/issues"
Changelog = "https://github.com/BravoRicDev/bravoric-ssh-client/blob/main/CHANGELOG.md"

[project.scripts]
bravoric-ssh = "bravoric_ssh_client.app:main"
bravoric-ssh-mcp = "bravoric_ssh_client.mcp_server:main"

[tool.setuptools.packages.find]
include = ["bravoric_ssh_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["bravoric_ssh_client"]
branch = true

[tool.coverage.report]
show_missing = true
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter; long docstrings are ok
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
